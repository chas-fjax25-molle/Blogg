<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/blog.jpg">
    <link rel="stylesheet" href="src/styles.css">
    <link rel="stylesheet" href="src/layout.css">
    <script type="module" src="src/index.js"></script>
    <title>Blog</title>

    <meta name="description" content="A blog about various topics">
    <meta name="keywords" content="blog, articles, read">
</head>

<body>
    <header role="banner">
        <a href="index.html" aria-label="Blog logo"><img src="/blog.jpg" alt="logo" class="logo" width="60"></a>
        <h1 class="site-title"> Blog</h1>
        <nav role="navigation" class="nav-menu" aria-label="Main navigation">
            <ul>
                <li><a href="index.html" aria-label="To home page"> HOME </a></li>
                <li><a href="about.html" aria-label="To about page"> ABOUT </a></li>
                <li><button id="authBtn" class="auth-btn">Login</button></li>
            </ul>
        </nav>
    </header>
    <div id="loginModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <button class="close-btn" aria-label="Close">&times;</button>

            <h2>Login</h2>

            <label>
            Username
            <input type="text" id="username">
            </label>

            <label>
            Password
            <input type="password" id="password">
            </label>

            <button id="loginBtn">Login</button>
        </div>
    </div>
    <main role="main">
        <h2>Recent Posts</h2>
        <section class="blog-posts">

        </section>
        <section class="blog-new-post">
            <form class ="new-post-form" action="/posts" method="POST" enctype="multipart/form-data">
                <h1>Create Blog Post</h1>

                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required />

                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" />

                    <label for="category">Category</label>
                    <select id="category" name="category">
                    <option value="">Select a category</option>
                    <option value="design">JavaScript</option>
                    <option value="tech">Tech</option>
                    <option value="life">Life</option>
                    </select>
                </div>

                <label for="content">Content</label>
                <textarea id="content" name="content" required></textarea>

                <label for="image">Featured Image</label>
                <input type="file" id="image" name="image" accept="image/*" />

                <label for="excerpt">Preview excerpt</label>
                <textarea id="excerpt" name="excerpt"></textarea>

                <label for="status">Publish Status</label>
                <select id="status" name="status">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
                </select>

                <button type="submit">Save Post</button>
            </form>

        </section>
    </main>

    <footer role="contentinfo">
        <p>© 2026 Malmö Group 3 Blog | All rights reserved.</p>
    </footer>

</body>

</html>
